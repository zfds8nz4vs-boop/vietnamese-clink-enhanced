name: Build and publish Vietnamese Clink pack
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: vvi-official-4-1
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Lexicons/**"
      - "source/**"
      - "tools/**"
      - "catalog/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE.md"
      - "RELEASE-NOTES.md"
      - ".github/workflows/release-vietnamese.yml"
permissions:
  contents: write
concurrency:
  group: vietnamese-clink-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch licensed Vietnamese sources
        run: |
          python3 tools/fetch-vietnamese-sources.py
          python3 -c "import bz2,pathlib; p=pathlib.Path('source/vie_sentences.tsv.bz2'); pathlib.Path('source/vie_sentences.tsv').write_bytes(bz2.open(p,'rb').read())"
      - name: Build dictionary, next-word model and Telex CIME
        run: |
          set -euo pipefail
          python3 tools/build-pack.py vi source/vi_50k.txt
          python3 tools/build-next-word.py vi source/vi_50k.txt source/vie_sentences.tsv
          python3 tools/build-telex-cime.py vi source/vi_50k.txt
          python3 tools/validate-pack.py vi
          python3 tools/validate-catalog.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build release manifest
        env:
          VERSION: \${{ github.event.inputs.tag || format('vvi-official-{0}-{1}', github.run_number, github.run_attempt) }}
        run: |
          set -euo pipefail
          python3 tools/build-release-manifest.py "$VERSION" "$GITHUB_REPOSITORY" out
          cp README.md NOTICE.md LICENSE.md RELEASE-NOTES.md out/
      - name: Publish immutable draft
        env:
          GH_TOKEN: \${{ github.token }}
          VERSION: \${{ github.event.inputs.tag || format('vvi-official-{0}-{1}', github.run_number, github.run_attempt) }}
          PRERELEASE: \${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
          args=(gh release create "$VERSION" --target "$GITHUB_SHA" --draft --title "Clink Vietnamese · Telex · $VERSION" --notes-file RELEASE-NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          "\${args[@]}"
          gh release upload "$VERSION" out/assets/* out/manifest.json README.md NOTICE.md LICENSE.md RELEASE-NOTES.md
          gh release edit "$VERSION" --draft=false
